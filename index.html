<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>FreeCAD — завдання та відеоуроки</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Завдання та відеоуроки з 3D-моделювання у FreeCAD">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #c0392b;
      --sidebar-width: 270px;
    }
    body { font-size: 16px; }
    .markdown-section { max-width: 860px; }
    .app-name-link { font-size: 1.15em; }
    /* Адаптивне відео YouTube 16:9 */
    .video {
      position: relative; width: 100%; padding-top: 56.25%;
      margin: 1em 0 1.5em; border-radius: 8px; overflow: hidden;
      box-shadow: 0 2px 10px rgba(0,0,0,.12); background: #000;
    }
    .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .video-placeholder {
      border: 2px dashed #ccc; border-radius: 8px; padding: 2.5em 1em;
      text-align: center; color: #888; margin: 1em 0 1.5em;
    }
    .task {
      border-left: 4px solid var(--theme-color); background: #fdf3f2;
      padding: .8em 1.2em; border-radius: 0 6px 6px 0; margin: 1.2em 0;
    }
    .preview { max-width: 320px; display: block; margin: .5em 0 1em; border-radius: 8px; }
    .lesson-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin: 1em 0; }
    .lesson-cards a {
      display: block; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px;
      text-decoration: none !important; color: inherit; transition: box-shadow .15s;
    }
    .lesson-cards a:hover { box-shadow: 0 3px 12px rgba(0,0,0,.12); }
    .lesson-cards img { width: 100%; border-radius: 6px; margin-bottom: 6px; }
    .lesson-cards b { color: var(--theme-color); }
  </style>
</head>
<body>
  <div id="app">Завантаження…</div>
  <script>
    window.$docsify = {
      name: 'FreeCAD: уроки',
      homepage: 'home.md',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: false,
      search: {
        placeholder: 'Пошук…',
        noData: 'Нічого не знайдено',
        depth: 3
      },
      pagination: {
        previousText: 'Попередній урок',
        nextText: 'Наступний урок',
        crossChapter: true
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
</body>
</html>
