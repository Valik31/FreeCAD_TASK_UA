name: Зібрати сайт

# Після кожної зміни .md-файлів (або стилів) перебудовує HTML-сторінки
# і зберігає їх у репозиторій. GitHub Pages потім публікує їх як завжди.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Встановити markdown-it-py
        run: pip install markdown-it-py

      - name: Зібрати сторінки
        run: python build.py

      - name: Зберегти зміни
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Нічого не змінилося"
          else
            git commit -m "Автоматичне збирання сайту"
            git push
          fi
